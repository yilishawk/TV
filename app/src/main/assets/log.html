<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>日志查看</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #0f0; padding: 10px; margin:0; }
        pre { white-space: pre-wrap; word-break: break-all; }
        .log { margin: 5px 0; }
    </style>
</head>
<body>
    <h2>🚀 实时日志 (Proxy + Catvod)</h2>
    <button onclick="location.reload()">刷新日志</button>
    <pre id="logs"></pre>

    <script>
        // 可以后续通过 JS 调用 /action 或其他接口拉取日志，这里先静态展示
        document.getElementById('logs').textContent = '日志服务器已启动\n请在 Logcat 或应用内触发操作后刷新此页面\n\n当前时间: ' + new Date().toLocaleString();
    </script>
</body>
</html>
