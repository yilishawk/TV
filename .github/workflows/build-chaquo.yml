name: Build Chaquopy TV (Leanback)

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build Flavor'
        required: true
        default: 'Leanback'
        type: choice
        options:
          - Leanback
          - Mobile
      abi:
        description: 'Target ABI'
        required: true
        default: 'armeabi-v7a'
        type: choice
        options:
          - armeabi-v7a
          - arm64-v8a
          - all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (with fallback)
        uses: actions/checkout@v4
        with:
          ref: release/chaquo          # 指定分支
          fetch-depth: 0               # 完整历史，减少 fetch 问题
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build APK (Fix armeabi-v7a Python issue)
        run: |
          echo "Building ${{ github.event.inputs.flavor }} for ${{ github.event.inputs.abi }}"
          
          ./gradlew clean
          
          if [ "${{ github.event.inputs.abi }}" = "armeabi-v7a" ] || [ "${{ github.event.inputs.abi }}" = "all" ]; then
            echo "🚀 Building armeabi-v7a with minify disabled (critical for Chaquopy)"
            ./gradlew :app:assemble${{ github.event.inputs.flavor }}Armeabi_v7aRelease \
              -PminifyEnabled=false \
              -PshrinkResources=false \
              --stacktrace
          else
            ./gradlew :app:assemble${{ github.event.inputs.flavor }}Release --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-${{ github.event.inputs.flavor }}-${{ github.event.inputs.abi }}
          path: app/build/outputs/apk/*/*/*.apk
          retention-days: 30
