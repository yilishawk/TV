name: Build FongMi TV

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: '打包版本'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - leanback
          - mobile

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Python 3.8（Chaquopy 构建需要）
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 锁定 Gradle Wrapper 版本
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: 生成 local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          # 占位签名信息（debug 不签名，release 走 unsigned）
          echo "storeFile=dummy" >> local.properties
          echo "keyAlias=dummy" >> local.properties
          echo "storePassword=dummy" >> local.properties

      - name: 临时禁用 release 签名配置（改用 debug 签名）
        run: |
          # 把 signingConfigs.release 整块替换成 debug 签名，避免 local.properties 缺 storeFile
          sed -i '/signingConfigs/,/^    }/s/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' app/build.gradle

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 打包 leanback arm64
        if: ${{ github.event.inputs.flavor == 'all' || github.event.inputs.flavor == 'leanback' }}
        run: ./gradlew assembleLeanbackArm64_v8aRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

      - name: 打包 leanback armeabi
        if: ${{ github.event.inputs.flavor == 'all' || github.event.inputs.flavor == 'leanback' }}
        run: ./gradlew assembleLeanbackArmeabi_v7aRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

      - name: 打包 mobile arm64
        if: ${{ github.event.inputs.flavor == 'all' || github.event.inputs.flavor == 'mobile' }}
        run: ./gradlew assembleMobileArm64_v8aRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

      - name: 打包 mobile armeabi
        if: ${{ github.event.inputs.flavor == 'all' || github.event.inputs.flavor == 'mobile' }}
        run: ./gradlew assembleMobileArmeabi_v7aRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

      - name: 收集 APK
        run: |
          mkdir -p apk_output
          find app/build/outputs/apk -name "*.apk" -exec cp {} apk_output/ \;
          ls -lh apk_output/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: apk_output/*.apk
          retention-days: 7
