name: Build Chaquopy TV (Leanback)

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build Flavor (Leanback=电视版)'
        required: true
        default: 'Leanback'
        type: choice
        options:
          - Leanback
          - Mobile
      abi:
        description: 'Target ABI'
        required: true
        default: 'armeabi-v7a'
        type: choice
        options:
          - armeabi-v7a
          - arm64-v8a
          - all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout from Official Repo
        uses: actions/checkout@v4
        with:
          repository: FongMi/TV
          ref: release/chaquo
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean Gradle Cache (Fix checksum error)
        run: |
          rm -rf ~/.gradle/wrapper/dists/gradle-*
          rm -rf ~/.gradle/caches/*
          echo "✅ Gradle cache cleaned"

      - name: Grant permission
        run: chmod +x gradlew

      - name: Cache Gradle (after clean)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build APK - Fix armeabi-v7a Python Rules
        run: |
          echo "🔨 Building ${{ inputs.flavor }} for ${{ inputs.abi }}"

          ./gradlew clean --no-daemon

          if [[ "${{ inputs.abi }}" == "armeabi-v7a" || "${{ inputs.abi }}" == "all" ]]; then
            echo "🚀 Building armeabi-v7a (minify disabled - critical for Chaquopy PY rules)"
            ./gradlew :app:assemble${{ inputs.flavor }}Armeabi_v7aRelease \
              -PminifyEnabled=false \
              -PshrinkResources=false \
              --no-daemon \
              --stacktrace
          else
            ./gradlew :app:assemble${{ inputs.flavor }}Release \
              --no-daemon \
              --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-${{ inputs.flavor }}-${{ inputs.abi }}-Release
          path: app/build/outputs/apk/*/*/*.apk
          retention-days: 30

      - name: Build Summary
        run: echo "✅ Build completed! Check Artifacts for APK."
