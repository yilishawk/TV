name: Build FongMi TV

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: '打包版本'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - leanback
          - mobile

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 设置 Python 3.10（Chaquopy 15.x 构建需要）
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 覆写 gradle-wrapper.properties
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS
          cat gradle/wrapper/gradle-wrapper.properties

      - name: 删除 daemon-jvm 约束
        run: rm -f gradle/gradle-daemon-jvm.properties

      - name: 生成 local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "storeFile=dummy" >> local.properties
          echo "keyAlias=dummy" >> local.properties
          echo "storePassword=dummy" >> local.properties

      - name: 临时改用 debug 签名
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' app/build.gradle

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 打包 leanback arm64
        if: ${{ github.event.inputs.flavor == 'all' || github.event.inputs.flavor == 'leanback' }}
        run: ./gradlew assembleLeanbackArm64_v8aRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

      - name: 打包 leanback armeabi
        if: ${{ github.event.inputs.flavor == 'all' || github.event.inputs.flavor == 'leanback' }}
        run: ./gradlew assembleLeanbackArmeabi_v7aRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

      - name: 打包 mobile arm64
        if: ${{ github.event.inputs.flavor == 'all' || github.event.inputs.flavor == 'mobile' }}
        run: ./gradlew assembleMobileArm64_v8aRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

      - name: 打包 mobile armeabi
        if: ${{ github.event.inputs.flavor == 'all' || github.event.inputs.flavor == 'mobile' }}
        run: ./gradlew assembleMobileArmeabi_v7aRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

      - name: 收集 APK
        run: |
          mkdir -p apk_output
          find app/build/outputs/apk -name "*.apk" -exec cp {} apk_output/ \;
          ls -lh apk_output/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: apk_output/*.apk
          retention-days: 7
