name: Build FongMi TV

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: '打包版本'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - leanback
          - mobile
      version:
        description: '版本号 (如 v5.2.6)'
        required: true
        default: 'v5.2.6'
      changelog:
        description: '变更日志'
        required: true
        default: '日常更新'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 覆写 gradle-wrapper.properties
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS
          cat gradle/wrapper/gradle-wrapper.properties

      - name: 删除 daemon-jvm 约束
        run: rm -f gradle/gradle-daemon-jvm.properties

      - name: 还原 keystore 文件
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: 生成 local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "storeFile=$(pwd)/keystore.jks" >> local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> local.properties

      - name: 移除 release 签名配置中的 localProps 读取（用环境变量替代）
        run: |
          perl -i -0pe 's/def localProps.*?localProps\.load.*?\)//s' app/build.gradle
          sed -i "s|file(localProps\['storeFile'\])|file(System.getenv('STORE_FILE') ?: 'keystore.jks')|" app/build.gradle
          sed -i "s|localProps\['keyAlias'\]|System.getenv('KEY_ALIAS')|" app/build.gradle
          sed -i "s|localProps\['keyPassword'\]|System.getenv('KEY_PASSWORD')|" app/build.gradle
          sed -i "s|localProps\['storePassword'\]|System.getenv('STORE_PASSWORD')|" app/build.gradle

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 打包 leanback arm64
        if: ${{ github.event.inputs.flavor == 'all' || github.event.inputs.flavor == 'leanback' }}
        run: ./gradlew assembleLeanbackArm64_v8aRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"
          STORE_FILE: ${{ github.workspace }}/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: 打包 leanback armeabi
        if: ${{ github.event.inputs.flavor == 'all' || github.event.inputs.flavor == 'leanback' }}
        run: ./gradlew assembleLeanbackArmeabi_v7aRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"
          STORE_FILE: ${{ github.workspace }}/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: 打包 mobile arm64
        if: ${{ github.event.inputs.flavor == 'all' || github.event.inputs.flavor == 'mobile' }}
        run: ./gradlew assembleMobileArm64_v8aRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"
          STORE_FILE: ${{ github.workspace }}/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: 打包 mobile armeabi
        if: ${{ github.event.inputs.flavor == 'all' || github.event.inputs.flavor == 'mobile' }}
        run: ./gradlew assembleMobileArmeabi_v7aRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"
          STORE_FILE: ${{ github.workspace }}/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: 收集 APK
        run: |
          mkdir -p apk_output
          find app/build/outputs/apk -name "*.apk" -exec cp {} apk_output/ \;
          ls -lh apk_output/

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.changelog }}
          files: apk_output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
